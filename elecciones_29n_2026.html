<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="dashboard">
  <meta name="design-style" content="briefing">
  <title>Explorador Electoral 29N 2026: Compara y Decide</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;

      /* Briefing style tokens */
      --background: #faf9f5;
      --surface-container-low: #ffffff;
      --surface-container: #f1efe8;
      --surface-container-high: #e6e2d6;

      --on-surface: #17181a;
      --on-surface-variant: #56585c;

      --outline: #17181a;
      --outline-variant: #dedad0;

      --primary: #17181a;
      --on-primary: #faf9f5;
      --primary-container: #f2b705;
      --on-primary-container: #17181a;
      --secondary: #1f4e5f;
      --tertiary: #785008;
      --error: #b42318;
      --on-error: #ffffff;

      --data-1: #1f4e5f;
      --data-2: #d99000;
      --data-3: #2b6e52;
      --data-4: #b84a39;
      --data-context: #c4bfb2;

      --font-headline: 'Source Serif 4', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-label: 'Geist Mono', monospace;

      --rounded: 0.25rem;
      --rounded-lg: 0.375rem;
      --rounded-full: 0.25rem;

      --section-rule: 1.5px solid var(--outline);
      --card-border: 1px solid var(--outline-variant);
      --badge-radius: 2px;
      --heading-tracking: -0.02em;
      --label-tracking: 0.08em;

      /* Shared foundation tokens */
      --positive: #2b6e52;
      --positive-bg: #e7f3ed;
      --warning: #785008;
      --warning-bg: #f5e6c4;
      --info-bg: #e7eff2;
      --error-bg: #fbeae8;
      --neutral-bg: #f1efe8;
      --focus: #1f4e5f;

      /* Type scale (Dashboard) */
      --display-size: clamp(1.75rem, 1.4rem + 1.2vw, 2.25rem);
      --headline-size: clamp(1.25rem, 1.1rem + 0.5vw, 1.5rem);
      --subhead-size: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
      --body-size: clamp(0.9375rem, 0.9rem + 0.15vw, 1rem);
      --label-size: 0.75rem;

      /* Spacing scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;

      --sidebar-w: 252px;
      --bottom-nav-h: 68px;
      --card-hover-shadow: 0 4px 12px rgba(23, 24, 26, 0.06);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      overflow-x: clip;
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.58;
      -webkit-font-smoothing: antialiased;
    }
    header { position: static !important; }
    button, input, select { font-family: inherit; }

    :focus-visible {
      outline: 2.5px solid var(--focus);
      outline-offset: 2px;
    }

    /* App Shell Layout */
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Desktop Sidebar */
    .app-sidebar {
      background: var(--surface-container);
      border-right: var(--card-border);
      padding: var(--space-lg) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand-block {
      border-bottom: var(--section-rule);
      padding-bottom: var(--space-md);
    }

    .dossier-pill {
      display: inline-block;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.6875rem;
      letter-spacing: var(--label-tracking);
      text-transform: uppercase;
      padding: 0.1875rem 0.5rem;
      border-radius: var(--badge-radius);
    }

    .brand-title {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.2;
      margin: var(--space-sm) 0 var(--space-xs);
      letter-spacing: var(--heading-tracking);
    }

    .brand-meta {
      font-family: var(--font-label);
      font-size: var(--label-size);
      color: var(--on-surface-variant);
      text-transform: uppercase;
    }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      width: 100%;
      min-height: 44px;
      padding: var(--space-sm) var(--space-md);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--rounded);
      color: var(--on-surface);
      font-size: 0.9375rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
    }

    .nav-btn:hover {
      background: var(--surface-container-high);
    }

    .nav-btn[aria-current="page"] {
      background: var(--primary);
      color: var(--on-primary);
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .sidebar-note {
      margin-top: auto;
      background: var(--surface-container-low);
      border: var(--card-border);
      border-top: var(--section-rule);
      padding: var(--space-md);
      font-size: 0.8125rem;
      color: var(--on-surface-variant);
    }

    /* Main Content Container */
    .page-grid {
      display: grid;
      gap: var(--space-lg);
      padding: var(--space-lg) var(--space-xl) var(--space-2xl);
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      align-content: start;
    }
    .page-grid * { min-width: 0; }

    /* Dossier Header Bar */
    .dossier-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      border-bottom: var(--section-rule);
      padding-bottom: var(--space-sm);
      margin-bottom: var(--space-md);
    }

    .dossier-left {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .dossier-meta {
      font-family: var(--font-label);
      font-size: var(--label-size);
      color: var(--on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .title {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: var(--display-size);
      letter-spacing: var(--heading-tracking);
      line-height: 1.08;
      margin: 0;
      color: var(--on-surface);
    }

    .section-title {
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: var(--headline-size);
      letter-spacing: var(--heading-tracking);
      line-height: 1.15;
      margin: 0;
    }

    .standfirst {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: var(--subhead-size);
      color: var(--secondary);
      margin: var(--space-xs) 0 0;
      max-width: 68ch;
    }

    .prose {
      max-width: 68ch;
      color: var(--on-surface);
      margin: var(--space-sm) 0 0;
    }

    /* Card Grids & Figures */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
      gap: var(--space-md);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
      gap: var(--space-md);
    }

    .figure-card {
      background: var(--surface-container-low);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .figure-card .kpi-label {
      font-family: var(--font-label);
      font-size: var(--label-size);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--on-surface-variant);
    }

    .figure-card .value {
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: 1.85rem;
      line-height: 1.1;
      font-variant-numeric: lining-nums tabular-nums;
      color: var(--on-surface);
    }

    .figure-card .kpi-sub {
      font-size: 0.8125rem;
      color: var(--on-surface-variant);
    }

    /* Action / Shortcut Cards */
    .shortcut-card {
      background: var(--surface-container-low);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
      padding: var(--space-md) var(--space-lg);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
      color: var(--on-surface);
    }

    .shortcut-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-hover-shadow);
    }

    .shortcut-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      width: 100%;
    }

    .index-num {
      font-family: var(--font-label);
      font-weight: 600;
      font-size: var(--label-size);
      color: var(--secondary);
      background: var(--surface-container);
      padding: 0.15rem 0.45rem;
      border-radius: var(--badge-radius);
    }

    .shortcut-title {
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: 1.125rem;
      margin: 0;
    }

    .shortcut-desc {
      font-size: 0.9rem;
      color: var(--on-surface-variant);
      margin: 0;
    }

    /* Badges & Status Chips */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-family: var(--font-label);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.22rem 0.5rem;
      border-radius: var(--badge-radius);
      white-space: nowrap;
    }

    .st-coincide { background: var(--positive-bg); color: var(--positive); }
    .st-parcial { background: var(--warning-bg); color: var(--warning); }
    .st-diverge { background: var(--error-bg); color: var(--error); }
    .st-insuficiente { background: var(--info-bg); color: var(--secondary); }
    .st-nocons { background: var(--neutral-bg); color: var(--on-surface-variant); }
    .st-ausente { background: var(--surface-container-high); color: var(--on-surface-variant); }

    /* Buttons & Controls */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      min-height: 44px;
      padding: 0.5rem 1rem;
      border-radius: var(--rounded);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      border: 1px solid var(--outline);
      background: var(--primary);
      color: var(--on-primary);
      transition: background-color var(--dur-micro) var(--ease-out), opacity var(--dur-micro) var(--ease-out);
    }

    .btn:hover { opacity: 0.92; }

    .btn-secondary {
      background: var(--surface-container-low);
      color: var(--on-surface);
      border: 1px solid var(--outline-variant);
    }

    .btn-secondary:hover {
      background: var(--surface-container);
    }

    .btn-sm {
      min-height: 36px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8125rem;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: center;
    }

    .filter-chip {
      min-height: 40px;
      padding: 0.375rem 0.75rem;
      border-radius: var(--rounded);
      border: 1px solid var(--outline-variant);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
    }

    .filter-chip:hover {
      background: var(--surface-container);
    }

    .filter-chip[aria-pressed="true"] {
      background: var(--secondary);
      color: var(--on-primary);
      border-color: var(--secondary);
    }

    .controls-bar {
      background: var(--surface-container);
      border-top: var(--section-rule);
      padding: var(--space-md);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      align-items: end;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      flex: 1 1 200px;
    }

    .field-label {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 600;
      text-transform: uppercase;
      color: var(--on-surface-variant);
      letter-spacing: 0.05em;
    }

    .field-input, .field-select {
      min-height: 44px;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded);
      background: var(--surface-container-low);
      color: var(--on-surface);
      font-size: 0.9375rem;
    }

    .field-select {
      padding-right: 2rem;
    }

    /* Aside / Methodology Callouts */
    .aside-box {
      background: var(--surface-container);
      border-top: var(--section-rule);
      padding: var(--space-md) var(--space-lg);
      font-size: 0.9375rem;
    }

    /* Simple Bar Charts */
    .chart-box {
      background: var(--surface-container-low);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
      padding: var(--space-md) var(--space-lg);
    }

    .chart-title {
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: 1.0625rem;
      margin: 0 0 0.25rem;
    }

    .chart-sub {
      font-family: var(--font-label);
      font-size: var(--label-size);
      color: var(--on-surface-variant);
      margin: 0 0 var(--space-md);
    }

    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 54px;
      gap: var(--space-sm);
      align-items: center;
      font-size: 0.875rem;
    }

    .bar-label {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      height: 14px;
      background: var(--surface-container);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width var(--dur-short) var(--ease-out);
    }

    .bar-val {
      font-family: var(--font-label);
      font-size: 0.8125rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--on-surface-variant);
    }

    /* Proposal 4-Element Card */
    .proposal-card {
      background: var(--surface-container-low);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .proposal-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-sm);
      border-bottom: 1px solid var(--outline-variant);
      padding-bottom: var(--space-sm);
    }

    .proposal-title {
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: 1.125rem;
      margin: 0;
    }

    .four-elements {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: var(--space-md);
    }

    .el-block h4 {
      font-family: var(--font-label);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--secondary);
      margin: 0 0 0.25rem;
    }

    .el-block p {
      margin: 0;
      font-size: 0.9rem;
    }

    /* Accordion "Leer más" */
    .accordion-trigger {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      min-height: 44px;
      padding: 0.375rem 0.75rem;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded);
      color: var(--on-surface);
      font-weight: 600;
      font-size: 0.8125rem;
      cursor: pointer;
      align-self: flex-start;
    }

    .accordion-trigger:hover {
      background: var(--surface-container-high);
    }

    .accordion-body {
      background: var(--surface-container);
      border-left: 3px solid var(--secondary);
      padding: var(--space-md);
      border-radius: 0 var(--rounded) var(--rounded) 0;
      font-size: 0.9rem;
      display: none;
    }

    .accordion-body.open {
      display: block;
    }

    .source-ref {
      margin-top: var(--space-sm);
      font-family: var(--font-label);
      font-size: 0.75rem;
      color: var(--on-surface-variant);
      border-top: 1px solid var(--outline-variant);
      padding-top: var(--space-xs);
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      background: var(--surface-container-low);
      border: var(--card-border);
      border-radius: var(--rounded-lg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      text-align: left;
    }

    thead th {
      font-family: var(--font-label);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--on-surface-variant);
      padding: 0.75rem 1rem;
      border-bottom: var(--section-rule);
      background: var(--surface-container-low);
    }

    tbody td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--outline-variant);
      vertical-align: top;
    }

    tbody tr:last-child td { border-bottom: none; }

    /* Viability 5 dimensions grid */
    .viab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(175px, 100%), 1fr));
      gap: var(--space-sm);
    }

    .viab-cell {
      background: var(--surface-container);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      border: 1px solid var(--outline-variant);
    }

    .viab-dim {
      font-family: var(--font-label);
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--on-surface-variant);
      margin-bottom: 0.2rem;
    }

    .viab-val {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--on-surface);
    }

    /* Map side-by-side positions */
    .positions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: var(--space-sm);
    }

    .position-box {
      background: var(--surface-container);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--rounded);
      border-left: 3px solid var(--data-1);
    }

    .position-box.diverge { border-left-color: var(--data-4); }
    .position-box.coincide { border-left-color: var(--data-3); }

    /* Mobile Bottom Navigation */
    .bottom-nav {
      display: none;
    }

    @media (max-width: 899px) {
      .app-shell {
        grid-template-columns: 1fr;
      }
      aside.app-sidebar {
        display: none;
      }
      .page-grid {
        padding: var(--space-md) var(--space-md) calc(var(--bottom-nav-h) + var(--space-xl));
      }
      .bottom-nav {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: var(--bottom-nav-h);
        background: var(--surface-container-low);
        border-top: var(--section-rule);
        z-index: 40;
      }
      .bottom-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: transparent;
        border: none;
        color: var(--on-surface-variant);
        font-size: 0.65rem;
        font-weight: 600;
        padding: 4px 2px;
        cursor: pointer;
        min-height: 44px;
      }
      .bottom-btn[aria-current="page"] {
        color: var(--primary);
        background: var(--surface-container);
        box-shadow: inset 0 3px 0 var(--primary-container);
      }
      .bottom-btn svg {
        width: 18px;
        height: 18px;
      }
    }

    @media (max-width: 640px) {
      .page-grid { grid-template-columns: 1fr; padding: var(--space-sm) var(--space-sm) calc(var(--bottom-nav-h) + var(--space-lg)); }
      aside { display: none; }
      .bar-row { grid-template-columns: 1fr; gap: 0.25rem; }
      .bar-val { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {

    const TRACE_RECORDS = [

      { partido: `ERC`, doc: `erc_2026.pdf`, ref: `Índice Bloque A, pp. 5–15`, tema: `Modelo Territorial`, fragmento: `Apartados: autodeterminación y derechos (p.7), lengua catalana (p.9), escuela catalana (p.10), financiación y soberanía fiscal (p.11), cultura (p.12) y más competencias (p.14).` },
      { partido: `Junts`, doc: `junts_2026.pdf`, ref: `Puntos 2–5 y 1.2–1.3`, tema: `Fiscalidad / Política Social`, fragmento: `Despliegue de reforma de dependencia y cuidados; eximir de plan económico-financiero a municipios sin déficit estructural y aceptar informe de intervención municipal para remanentes.` },

      { partido: `Podemos`, doc: `podemos_2026.pdf`, ref: `Puntos 162–168`, tema: `Igualdad y Derechos`, fragmento: `Madres protectoras, ampliar violencia machista (Estambul, digital, política), violencia obstétrica, Ley de lactancia, anticoncepción gratuita y frenar gestación subrogada.` },
      { partido: `Podemos`, doc: `podemos_2026.pdf`, ref: `Puntos 280–282 y 301–303`, tema: `Educación / Sanidad`, fragmento: `7 % PIB en educación pública directa (0–3 gratuita en 4 años), doble ratio NEAE; 2.900 €/hab en SNS (~8 % PIB), +20 % salarios bajos y producción pública de medicamentos.` },
      { partido: `Podemos`, doc: `podemos_2026.pdf`, ref: `Puntos 384–388`, tema: `Energía y Medio Ambiente`, fragmento: `Prohibir vertidos mineros en ríos, implantar SDDR de envases, Estrategia Residuo Cero y prevención anual de incendios con Fondo Forestal municipal.` },

    ];

    // =========================================================================
    // ESTADO DE LA APLICACIÓN + PERSISTENCIA CON NOTEBOOK APP API
    // =========================================================================
    const appState = {
      activeView: `inicio`,
      selectedPartyId: null,
      partySearch: ``,
      partyCoverageFilter: `todas`,
      partyTopicFilter: `Todas`,
      selectedTopic: `Vivienda`,
      comparedParties: PARTIES.map(p => p.id),
      mapTopicFilter: `Todos`,
      mapTypeFilter: `Todos`,
      viabPartyFilter: `Todos`,
      sourcePartyFilter: `Todos`,
      sourceSearch: ``
    };

    async function persistState() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
          await window.notebookAppApi.setAppState({
            activeView: appState.activeView,
            selectedPartyId: appState.selectedPartyId,
            selectedTopic: appState.selectedTopic,
            comparedParties: appState.comparedParties
          });
        }
      } catch (e) {
        // Silencio seguro si el host no admite persistencia
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, `&amp;`)
        .replace(/</g, `&lt;`)
        .replace(/>/g, `&gt;`)
        .replace(/"/g, `&quot;`);
    }

    function navigateTo(view, opts) {
      appState.activeView = view;
      if (opts && opts.partyId !== undefined) appState.selectedPartyId = opts.partyId;
      if (opts && opts.topic) appState.selectedTopic = opts.topic;
      if (view === `partidos` && (!opts || opts.partyId === undefined)) {
        // Mantener ficha si ya estaba o mostrar rejilla si se viene de otro sitio
      }
      updateNavIndicators();
      renderApp();
      persistState();
      const main = document.getElementById(`main-content`);
      if (main) main.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: `auto` });
    }

    function updateNavIndicators() {
      document.querySelectorAll(`[data-view]`).forEach(btn => {
        if (btn.dataset.view === appState.activeView) {
          btn.setAttribute(`aria-current`, `page`);
        } else {
          btn.removeAttribute(`aria-current`);
        }
      });
    }

    function openPartyDetail(partyId) {
      appState.selectedPartyId = partyId;
      appState.partyTopicFilter = `Todas`;
      appState.activeView = `partidos`;
      updateNavIndicators();
      renderApp();
      persistState();
      window.scrollTo({ top: 0, behavior: `auto` });
    }

    function closePartyDetail() {
      appState.selectedPartyId = null;
      renderApp();
      persistState();
    }

    function getFilteredParties() {
      const q = appState.partySearch.trim().toLowerCase();
      return PARTIES.filter(p => {
        const matchQ = !q || p.nombre.toLowerCase().includes(q) || p.siglas.toLowerCase().includes(q) || p.resumen.toLowerCase().includes(q);
        const matchCov = appState.partyCoverageFilter === `todas` || p.cobertura === appState.partyCoverageFilter;
        return matchQ && matchCov;
      });
    }

    function renderPartyCardsHtml(filtered) {
      return filtered.length ? filtered.map(p => `
        <article class="figure-card" style="justify-content: space-between; gap: var(--space-md);">
          <div style="display:flex; flex-direction:column; gap: var(--space-xs);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:var(--space-sm); flex-wrap:wrap;">
              <span class="index-num">${escapeHtml(p.siglas)}</span>
              <span class="status-badge ${p.coberturaClass}">${escapeHtml(p.cobertura)}</span>
            </div>
            <h2 class="shortcut-title" style="margin-top:var(--space-xs);">${escapeHtml(p.nombre)}</h2>
            <p class="shortcut-desc">${escapeHtml(p.resumen)}</p>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:var(--space-sm); border-top:1px solid var(--outline-variant); padding-top:var(--space-sm);">
            <span class="dossier-meta">${p.propuestas.length} bloques</span>
            <button type="button" class="btn btn-sm" onclick="openPartyDetail('${p.id}')">Ver ficha</button>
          </div>
        </article>
      `).join(``) : `
        <div class="aside-box" style="grid-column:1/-1;">
          <strong>Sin resultados</strong>: ninguna formación coincide con los filtros actuales. <button type="button" class="btn btn-secondary btn-sm" onclick="resetPartyFilters()" style="margin-left:var(--space-sm);">Restablecer filtros</button>
        </div>
      `;
    }

    function resetPartyFilters() {
      appState.partySearch = ``;
      appState.partyCoverageFilter = `todas`;
      renderApp();
    }

    function setPartySearch(val) {
      appState.partySearch = val;
      const grid = document.getElementById(`parties-grid`);
      if (grid) {
        grid.innerHTML = renderPartyCardsHtml(getFilteredParties());
      } else {
        renderApp();
      }
    }

    function setPartyCoverageFilter(val) {
      appState.partyCoverageFilter = val;
      renderApp();
    }

    function setPartyTopicFilter(val) {
      appState.partyTopicFilter = val;
      renderApp();
    }

    function selectTopic(topicId) {
      appState.selectedTopic = topicId;
      renderApp();
      persistState();
    }

    function toggleCompareParty(partyId) {
      const idx = appState.comparedParties.indexOf(partyId);
      if (idx >= 0) {
        if (appState.comparedParties.length > 1) {
          appState.comparedParties.splice(idx, 1);
        }
      } else {
        appState.comparedParties.push(partyId);
      }
      renderApp();
      persistState();
    }

    function setComparePreset(preset) {
      if (preset === `all`) {
        appState.comparedParties = PARTIES.map(p => p.id);
      } else if (preset === `with-info`) {
        const topicMap = TOPIC_COMPARISONS[appState.selectedTopic] || {};
        const matches = PARTIES.filter(p => topicMap[p.id]).map(p => p.id);
        appState.comparedParties = matches.length ? matches : PARTIES.map(p => p.id);
      } else if (preset === `with-docs`) {
        appState.comparedParties = PARTIES.filter(p => p.cobertura !== `Documento ausente`).map(p => p.id);
      }
      renderApp();
      persistState();
    }

    function setMapFilter(kind, val) {
      if (kind === `topic`) appState.mapTopicFilter = val;
      if (kind === `type`) appState.mapTypeFilter = val;
      renderApp();
    }

    function setViabPartyFilter(val) {
      appState.viabPartyFilter = val;
      renderApp();
    }

    function getFilteredTraces() {
      const q = appState.sourceSearch.trim().toLowerCase();
      return TRACE_RECORDS.filter(r => {
        const matchP = appState.sourcePartyFilter === `Todos` || r.partido === appState.sourcePartyFilter;
        const matchQ = !q || r.fragmento.toLowerCase().includes(q) || r.tema.toLowerCase().includes(q) || r.partido.toLowerCase().includes(q);
        return matchP && matchQ;
      });
    }

    function renderTraceRowsHtml(filteredTraces) {
      return filteredTraces.length ? filteredTraces.map(r => `
        <tr>
          <td><strong>${escapeHtml(r.partido)}</strong></td>
          <td style="font-family:var(--font-label); font-size:0.8rem;">${escapeHtml(r.doc)}<br>${escapeHtml(r.ref)}</td>
          <td>${escapeHtml(r.tema)}</td>
          <td>${escapeHtml(r.fragmento)}</td>
        </tr>
      `).join(``) : `
        <tr><td colspan="4">No hay registros que coincidan con la búsqueda.</td></tr>
      `;
    }

    function setSourceFilter(kind, val) {
      if (kind === `party`) {
        appState.sourcePartyFilter = val;
        renderApp();
        return;
      }
      if (kind === `search`) {
        appState.sourceSearch = val;
        const tbody = document.getElementById(`trace-tbody`);
        if (tbody) {
          tbody.innerHTML = renderTraceRowsHtml(getFilteredTraces());
        } else {

        }
      }

    function toggleAccordion(btn) {
      const targetId = btn.getAttribute(`aria-controls`);
      const panel = document.getElementById(targetId);
      if (!panel) return;
      const isOpen = btn.getAttribute(`aria-expanded`) === `true`;
      btn.setAttribute(`aria-expanded`, isOpen ? `false` : `true`);
      panel.classList.toggle(`open`, !isOpen);
      const label = btn.querySelector(`.acc-label`);
      if (label) label.textContent = isOpen ? `Leer más` : `Ocultar detalle`;
    }

      const filtered = getFilteredParties();

      const visibleProps = party.propuestas.filter(pr => appState.partyTopicFilter === `Todas` || pr.tema === appState.partyTopicFilter);

      return `

    function getPartyTopicRecord(party, topicId) {
      const topicMap = TOPIC_COMPARISONS[topicId] || {};
      if (topicMap[party.id]) return topicMap[party.id];

      if (party.cobertura === `Documento ausente`) {
        return {
          estado: `Información insuficiente`,
          cls: `st-insuficiente`,
          texto: `Documento ausente en el corpus analizado. No es posible determinar la postura de ${party.siglas} sobre ${topicId}.`,
          detalle: `La falta de documento fuente impide evaluar coincidencias o discrepancias. Nunca debe interpretarse como oposición o ausencia de programa.`,
          fuente: `Sin documento aportado`
        };
      }
      if (party.cobertura === `Solo portada / metadatos`) {
        return {
          estado: `Información insuficiente`,
          cls: `st-insuficiente`,
          texto: `Solo se dispone de portada y colofón editorial (${party.doc}). No hay contenido programático en ${topicId}.`,
          detalle: `El documento del corpus no incluye texto de medidas ni índice de capítulos.`,
          fuente: `${party.doc} · Portada`
        };
      }
      return {
        estado: `No consta en los extractos analizados`,
        cls: `st-nocons`,
        texto: `No constan propuestas sobre ${topicId} dentro de los fragmentos disponibles de ${party.siglas}.`,
        detalle: `Solo se han analizado los extractos parciales (${party.alcance}). La ausencia en estos fragmentos no significa que el partido se oponga o carezca de medidas en su programa completo.`,
        fuente: `${party.doc} · Alcance parcial (${party.alcance})`
      };
    }

    function renderTemas() {
      const topicObj = TOPICS.find(t => t.id === appState.selectedTopic) || TOPICS[0];

      // Estadísticas rápidas sobre los partidos visibles

      const rows = visibleParties.map(p => {
        const rec = getPartyTopicRecord(p, topicObj.id);
        if (rec.estado === `Coincidencia expresa`) counts.coincide++;
        else if (rec.estado === `Coincidencia parcial`) counts.parcial++;
        else if (rec.estado === `Divergencia expresa`) counts.diverge++;
        else if (rec.estado === `Información insuficiente`) counts.insuf++;
        else counts.nocons++;

            <div class="bar-row"><span class="bar-label">Divergencia expresa</span><div class="bar-track"><div class="bar-fill" style="width:${(counts.diverge/total)*100}%;background:var(--data-4)"></div></div><span class="bar-val">${counts.diverge}</span></div>

          </div>
        </section>

            const accId = `cmp-${party.id}-${idx}`;
            return `

                <div style="display:flex; flex-direction:column; gap:var(--space-xs);">

                  <tr>
                    <td><strong>${escapeHtml(p.siglas)}</strong> · ${escapeHtml(p.nombre)}</td>
                    <td style="font-family:var(--font-label); font-size:0.8rem;">${escapeHtml(p.doc)}</td>
                    <td><span class="status-badge ${p.coberturaClass}">${escapeHtml(p.cobertura)}</span></td>
                    <td>${escapeHtml(p.alcance)}</td>
                  </tr>
                `).join(``)}
              </tbody>
            </table>
          </div>
        </section>

        <section aria-labelledby="trace-title">
          <h2 id="trace-title" class="section-title" style="margin-bottom:var(--space-sm);">Registro de trazabilidad por fragmento</h2>
          <div class="controls-bar" style="margin-bottom:var(--space-md);">
            <div class="field-group">
              <label class="field-label" for="trace-party-select">Filtrar por partido</label>
              <select id="trace-party-select" class="field-select" onchange="setSourceFilter('party', this.value)">
                <option value="Todos" ${appState.sourcePartyFilter === `Todos` ? `selected` : ``}>Todos los partidos con documento</option>
                ${[...new Set(TRACE_RECORDS.map(r => r.partido))].map(pt => `<option value="${pt}" ${appState.sourcePartyFilter === pt ? `selected` : ``}>${escapeHtml(pt)}</option>`).join(``)}
              </select>
            </div>
            <div class="field-group">
              <label class="field-label" for="trace-search-input">Buscar en fragmentos verificados</label>
              <input id="trace-search-input" class="field-input" type="search" value="${escapeHtml(appState.sourceSearch)}" oninput="setSourceFilter('search', this.value)" placeholder="Ej. 2.900, ENCE, IRPF, 40 %...">
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Partido</th>
                  <th>Documento y referencia</th>
                  <th>Ámbito</th>
                  <th>Fragmento o contenido verificado</th>
                </tr>
              </thead>
              <tbody id="trace-tbody">
                ${renderTraceRowsHtml(filteredTraces)}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderApp() {
      const main = document.getElementById(`main-content`);
      if (!main) return;

      let html = ``;
      if (appState.activeView === `inicio`) html = renderInicio();
      else if (appState.activeView === `partidos`) html = renderPartidos();
      else if (appState.activeView === `temas`) html = renderTemas();
      else if (appState.activeView === `mapa`) html = renderMapa();
      else if (appState.activeView === `viabilidad`) html = renderViabilidad();
      else if (appState.activeView === `fuentes`) html = renderFuentes();

      main.innerHTML = html;

      if (window.lucide && typeof window.lucide.createIcons === `function`) {
        window.lucide.createIcons();
      }
    }

    async function initApp() {
      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
          const saved = await window.notebookAppApi.getAppState();
          if (saved) {
            if (saved.activeView) appState.activeView = saved.activeView;
            if (saved.selectedPartyId !== undefined) appState.selectedPartyId = saved.selectedPartyId;
            if (saved.selectedTopic) appState.selectedTopic = saved.selectedTopic;
            if (Array.isArray(saved.comparedParties) && saved.comparedParties.length) {
              appState.comparedParties = saved.comparedParties;
            }
          }
        }
      } catch (e) {
        // Uso de estado inicial por defecto
      }

      updateNavIndicators();
      renderApp();

      try {
        if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
          window.notebookAppApi.notifyAppReady();
        }
      } catch (e) {
        // Ignorar fuera del visor host
      }
    }

    initApp();
  </script>
</body>
</html>
